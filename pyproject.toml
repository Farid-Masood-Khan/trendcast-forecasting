[project]
name = "trendcast-forecasting"
version = "0.1.0"
description = "Pakistan Food Commodities Time-Series Forecasting Dashboard with Calibrated Uncertainty"
readme = "docs/README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "plotly>=5.19.0",
    "streamlit>=1.32.0",
    "requests>=2.31.0",
    "prophet>=1.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "pandas-stubs>=2.1.4.231227",
    "types-requests>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

